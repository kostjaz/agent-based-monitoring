services:
  alloy:
    volumes:
      - ./alloy/targets-containers:/etc/alloy/optional-targets:ro
    depends_on:
      - compose-state-collector

  compose-state-collector:
    image: docker:29-cli
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - /opt/compose-state-collector/collector.sh
    environment:
      COMPOSE_PROJECT_DIRECTORY: ${COMPOSE_PROJECT_DIRECTORY:-/opt/s2snext}
      MONITORED_CONTAINER_NAMES: ${MONITORED_CONTAINER_NAMES:-}
      COLLECTION_INTERVAL: ${CONTAINER_COLLECTION_INTERVAL:-15}
    volumes:
      - ./compose-state-collector:/opt/compose-state-collector:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - type: bind
        source: ${COMPOSE_PROJECT_DIRECTORY:-/opt/s2snext}
        target: ${COMPOSE_PROJECT_DIRECTORY:-/opt/s2snext}
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /var/lib/compose-state-collector
