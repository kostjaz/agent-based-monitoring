services:
  alloy-pilot:
    image: grafana/alloy:v1.18.0
    restart: unless-stopped
    privileged: true
    pid: host
    env_file: .env
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
    volumes:
      - ./alloy/pilot.config.alloy:/etc/alloy/config.alloy:ro
      - /:/rootfs:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/run:/var/run:rw
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
      - alloy_pilot_data:/var/lib/alloy/data
    devices:
      - /dev/kmsg:/dev/kmsg

  cadvisor-pilot:
    image: ghcr.io/google/cadvisor:v0.60.5
    restart: unless-stopped
    privileged: true
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    devices:
      - /dev/kmsg:/dev/kmsg

  compose-state-collector:
    image: docker:29-cli
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - /opt/compose-state-collector/collector.sh
    environment:
      COMPOSE_PROJECT_DIRECTORY: ${COMPOSE_PROJECT_DIRECTORY:-/opt/s2snext}
      MONITORED_CONTAINER_NAMES: ${MONITORED_CONTAINER_NAMES:-}
      COLLECTION_INTERVAL: ${CONTAINER_COLLECTION_INTERVAL:-15}
    volumes:
      - ./compose-state-collector:/opt/compose-state-collector:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - type: bind
        source: ${COMPOSE_PROJECT_DIRECTORY:-/opt/s2snext}
        target: ${COMPOSE_PROJECT_DIRECTORY:-/opt/s2snext}
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /var/lib/compose-state-collector

volumes:
  alloy_pilot_data:
