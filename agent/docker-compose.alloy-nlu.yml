services:
  alloy:
    volumes:
      - ./alloy/targets-nlu:/etc/alloy/optional-targets:ro
    depends_on:
      - nvidia-gpu-exporter

  nvidia-gpu-exporter:
    image: utkuozdemir/nvidia_gpu_exporter:1.14.0
    restart: unless-stopped
    command:
      - --collect.interval=15s
    environment:
      NVIDIA_DRIVER_CAPABILITIES: utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu
